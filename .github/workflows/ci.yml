name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No secrets are used anywhere in this workflow, and none are needed.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: Shell syntax
        run: |
          bash -n setup.sh
          bash -n verify.sh
          shellcheck -S warning setup.sh verify.sh

      - name: Python syntax
        run: python -m compileall -q scripts tests

      - name: Tests
        run: python -m pytest tests -q

      - name: Public audit (secrets, PII, local paths)
        run: python scripts/audit_public.py .

      - name: Patch applies to pinned upstream
        run: |
          set -euo pipefail
          PINNED=b56aafc2ef6befd96ecf00bf4788031cf4be169b
          git clone --quiet https://github.com/NousResearch/hermes-agent /tmp/hermes
          git -C /tmp/hermes checkout --quiet --detach "$PINNED"
          git -C /tmp/hermes apply --check -v "$GITHUB_WORKSPACE/patches/voice-and-desktop-features.patch"
