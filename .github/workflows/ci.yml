name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      pi_runtime: ${{ steps.classify.outputs.pi_runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
      - name: Resolve and classify the complete change set
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python scripts/classify_ci_changes.py --force --github-output "$GITHUB_OUTPUT" </dev/null
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BEFORE"
          else
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          git cat-file -e "$base^{commit}"
          git diff --name-only -z "$base" HEAD | \
            python scripts/classify_ci_changes.py --nul --github-output "$GITHUB_OUTPUT"

  release-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip==26.1.1
          python -m pip install PyYAML==6.0.3 pytest==9.1.1

      # Must precede pytest: adversarial scanner tests never skip and use this
      # exact checksum-verified workspace binary.
      - name: Install and verify pinned Gitleaks
        run: ./scripts/install_gitleaks.sh

      - name: Shell syntax and ShellCheck
        run: |
          test "$(shellcheck --version | awk '/version:/{print $2}')" = 0.9.0
          bash -n setup.sh verify.sh scripts/*.sh messaging/*.sh modules/pi-runtime/*.sh
          shellcheck -S warning setup.sh verify.sh scripts/*.sh messaging/*.sh modules/pi-runtime/*.sh

      - name: Python syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/hermes-coder-pycache
        run: python -m compileall -q scripts tests second-brain/src second-brain/tests coder-stack/bin coder-stack/tests modules/pi-runtime/pi_module.py

      - name: Root and Second Brain tests
        env:
          HERMES_TEST_GITLEAKS: ${{ github.workspace }}/.tools/gitleaks/8.30.1/gitleaks
        run: python -m pytest tests second-brain/tests -q

      - name: Existing model-free coder-stack snapshot tests
        env:
          PYTHONPYCACHEPREFIX: /tmp/hermes-coder-pycache
        working-directory: coder-stack
        run: python -m unittest discover -s tests -q

      - name: Resolve actual change base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BEFORE"
          else
            base="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          git cat-file -e "$base^{commit}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Authoritative release audit
        env:
          RELEASE_DIFF_BASE: ${{ steps.diff.outputs.base }}
        run: ./scripts/release_audit.sh

      - name: Exact-pin patched upstream suite
        # prove_patch.sh first requires plain `git apply --check --whitespace=error-all`.
        run: ./scripts/prove_patch.sh --run-tests

      - name: Release tuple assertion
        run: |
          grep -F 5fc308a70719a83cccdbba4c0e39c23f5a8239d5 setup.sh >/dev/null
          grep -F v2026.8.27 setup.sh >/dev/null

  pi-runtime:
    needs: changes
    if: needs.changes.outputs.pi_runtime == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/pi-runtime.yml

  check:
    name: check
    if: always()
    needs: [changes, release-gates, pi-runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
      - name: Fail on every failed or unexpectedly skipped required job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PI_RUNTIME_REQUIRED: ${{ needs.changes.outputs.pi_runtime }}
        run: python scripts/classify_ci_changes.py --check-needs
