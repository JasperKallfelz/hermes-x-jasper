name: Release v0.3.0

on:
  push:
    tags: [v0.3.0]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  pi-runtime:
    permissions:
      contents: read
    uses: ./.github/workflows/pi-runtime.yml

  gates:
    needs: pi-runtime
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
      - run: |
          python -m pip install --upgrade pip==26.1.1
          python -m pip install PyYAML==6.0.3 pytest==9.1.1
      - run: ./scripts/install_gitleaks.sh
      - name: Verify candidate ancestry and tag target
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            tag="${{ github.event.release.tag_name || github.ref_name }}"
            test "$tag" = v0.3.0
            test "$(git rev-list -n1 "$tag")" = "$(git rev-parse HEAD)"
          fi
      - name: Tests and authoritative release audit
        env:
          HERMES_TEST_GITLEAKS: ${{ github.workspace }}/.tools/gitleaks/8.30.1/gitleaks
          RELEASE_DIFF_BASE: HEAD^
        run: |
          python -m pytest tests second-brain/tests -q
          ./scripts/release_audit.sh
          ./scripts/prove_patch.sh --run-tests
      - name: Build and rescan the final upload bytes
        run: |
          python scripts/build_release_artifact.py --candidate HEAD --output release-output
          python scripts/audit_public.py release-output/unpacked/hermes-x-jasper-v0.3.0 --all-files
          python scripts/audit_public.py release-output/release-run.json --all-files
          .tools/gitleaks/8.30.1/gitleaks dir release-output \
            --config .gitleaks.toml --redact --no-banner --ignore-gitleaks-allow
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("release-output"); m=json.loads((p/"release-run.json").read_text()); assert hashlib.sha256((p/m["archive"]).read_bytes()).hexdigest()==m["archive_sha256"]'

  publish:
    needs: [pi-runtime, gates]
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.3.0'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.15"
      - run: |
          python -m pip install --upgrade pip==26.1.1
          python -m pip install PyYAML==6.0.3
      - run: ./scripts/install_gitleaks.sh
      # Rebuild and re-run the authoritative gates in the only job holding a
      # write token; publication is the final command and cannot precede them.
      - env:
          RELEASE_DIFF_BASE: HEAD^
        run: |
          ./scripts/release_audit.sh
          python scripts/build_release_artifact.py --candidate HEAD --output release-output
          python scripts/audit_public.py release-output/unpacked/hermes-x-jasper-v0.3.0 --all-files
          python scripts/audit_public.py release-output/release-run.json --all-files
          .tools/gitleaks/8.30.1/gitleaks dir release-output \
            --config .gitleaks.toml --redact --no-banner --ignore-gitleaks-allow
          python -c 'import hashlib,json,pathlib; p=pathlib.Path("release-output"); m=json.loads((p/"release-run.json").read_text()); assert hashlib.sha256((p/m["archive"]).read_bytes()).hexdigest()==m["archive_sha256"]'
      - name: Publish verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 \
            release-output/hermes-x-jasper-v0.3.0.tar.gz \
            release-output/release-run.json \
            --verify-tag --title "Hermes x Jasper v0.3.0" --notes-file CHANGELOG.md
