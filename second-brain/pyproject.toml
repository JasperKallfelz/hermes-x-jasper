[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-second-brain"
version = "0.1.0"
description = "Public-safe local Second Brain sync helper for Hermes CLI starters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hermes Second Brain contributors"}]
dependencies = []

[project.scripts]
hermes-second-brain = "hermes_second_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
